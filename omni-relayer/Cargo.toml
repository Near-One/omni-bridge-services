[package]
name = "omni-relayer"
version = "0.6.33"
edition = "2024"
repository = "https://github.com/Near-One/omni-bridge"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

chrono = "0.4"

anyhow = "1"
futures = "0.3.5"

clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15"
toml = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "1.5.1"
rust_decimal = { version = "1.37.2", features = ["maths"] }

rustls = { version = "0.23.23", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1" }

# The SDK (solana-bridge-client) moved to the solana 4.x crates. `solana-sdk` 4.x
# re-exports the granular crates under the same module paths, so internal code keeps
# compiling; `solana-rpc-client`/`-api` 4.x provide the RpcClient + error types that
# cross into the SDK.
solana-sdk = "4.0.1"
solana-rpc-client = "4.1.2"
solana-rpc-client-api = "4.1.2"
# Only the non-default `native-indexers` feature uses these (still on solana 2.x);
# gated as optional so the default build stays on a single solana (4.x) stack.
solana-client = { version = "2.1.9", optional = true }
solana-transaction-status = { version = "2.1.9", optional = true }

omni-types = { workspace = true }
bridge-indexer-types = { path = "../bridge-indexer-types", optional = true }

near-lake-framework = { version = "0.7.14", optional = true }
near-jsonrpc-client = "0.20.0"
near-jsonrpc-primitives = "0.34.2"
near-primitives = "0.34.2"
near-crypto = "0.34.2"
near-sdk = { version = "5.24.1", features = ["unit-testing"] }

hex = "0.4.3"
sha2 = "0.10"
alloy = { version = "1.1", features = ["node-bindings", "providers", "rpc-types", "sol-types", "provider-ws", "signers", "signer-local"] }

mongodb = { version = "3.2.2", optional = true }
redis = { version = "0.32.5", features = ["aio", "tokio-comp", "connection-manager", "json"] }
async-nats = "0.45"
reqwest = "0.12"
uuid = { version = "1", features = ["v4", "fast-rng"] }

bridge-connector-common = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "bridge-connector-common", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
near-rpc-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "near-rpc-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }

near-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "near-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
evm-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "evm-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
solana-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "solana-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
starknet-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "starknet-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
aptos-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "aptos-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
utxo-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "utxo-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
utxo-utils = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "utxo-utils", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
wormhole-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "wormhole-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
hypercore-bridge-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "hypercore-bridge-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }
light-client = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "light-client", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }

omni-connector = { git = "https://github.com/Near-One/bridge-sdk-rs", package = "omni-connector", rev = "87f336663d2bb7e74a009405d2198357c04cd59a" }

[features]
default = ["nats-ingestion"]
nats-ingestion = ["dep:bridge-indexer-types"]
mongo-ingestion = ["dep:mongodb", "dep:bridge-indexer-types"]
native-indexers = ["dep:near-lake-framework", "dep:solana-client", "dep:solana-transaction-status"]
