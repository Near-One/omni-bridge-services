# wormhole-vaa-api — mainnet config.
#
# `${ENV}` references are expanded at load time (same scheme as omni-proxy), so
# secrets/hosts can come from the environment. Nothing here is secret (all in-cluster,
# unauthenticated), so literal cluster DNS values are fine.

# Wormhole spy gRPC (guardiand spy), plaintext h2c.
spy_addr = "wormhole-spy.wormhole-vaa-api-mainnet.svc.cluster.local:7073"
# Redis store (TTL'd VAA cache + txHash-resolution cache).
redis_url = "redis://wormhole-vaa-api-redis.wormhole-vaa-api-mainnet.svc.cluster.local:6379"
# omni-proxy base URL used to reach chain RPCs.
proxy_base_url = "http://omni-proxy.omni-proxy-mainnet.svc.cluster.local"
# Public wormholescan, queried per-request when our store is missing a VAA (and cached).
# Omit to disable the fallback and serve only from our own store.
wormholescan_base_url = "https://api.wormholescan.io"

# Stored VAAs live ≥14 days so a redeploy does not drop recent VAAs.
vaa_ttl_secs = 1296000   # 15 days
# Cached txHash → resolution.
txres_ttl_secs = 86400   # 1 day

# Canonical Wormhole chain ids (network-agnostic). HyperEVM = 47 (verified; NOT
# HyperCore=65000). EVM `emitter` is our omni_bridge contract; `core` is the Wormhole
# core bridge. SVM `emitter` is the bridge `config` PDA's 32-byte address (hex).

[[chains]]
name = "arb"
family = "evm"
wh_chain_id = 23
emitter = "0xd025b38762B4A4E36F0Cde483b86CB13ea00D989"
core = "0xa5f208e072434bC67592E4C49C1B991BA79BCA46"
proxy_prefix = "/arb"

