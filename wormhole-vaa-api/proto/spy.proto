// Trimmed, self-contained copy of the Wormhole Spy gRPC contract.
//
// Source: github.com/wormhole-foundation/wormhole proto/spy/v1/spy.proto
//
// Wire-compatible by design (protobuf identifies fields by number + wire type,
// not by .proto identity or message/enum names):
//   * `package spy.v1` and the service/rpc names are kept BYTE-IDENTICAL because
//     gRPC routes on "/spy.v1.SpyRPCService/SubscribeSignedVAA".
//   * `publicrpc.v1.ChainID chain_id` is replaced by `int32 chain_id` — proto3
//     enums are encoded as varint int32 on the wire, so this is identical.
//   * The `option (google.api.http)` gateway annotation and the unused
//     gossip/publicrpc imports are dropped (they have no effect on a gRPC client).
syntax = "proto3";

package spy.v1;

// An exact match for an emitter.
message EmitterFilter {
  // Source chain (Wormhole chain id).
  int32 chain_id = 1;
  // Hex-encoded (without leading 0x) 32-byte emitter address.
  string emitter_address = 2;
}

message BatchFilter {
  int32 chain_id = 1;
  bytes tx_id = 2;
  uint32 nonce = 3;
}

message BatchTransactionFilter {
  int32 chain_id = 1;
  bytes tx_id = 2;
}

message FilterEntry {
  oneof filter {
    EmitterFilter emitter_filter = 1;
    BatchFilter batch_filter = 2;
    BatchTransactionFilter batch_transaction_filter = 3;
  }
}

message SubscribeSignedVAARequest {
  // List of filters to apply to the stream (OR). Empty = stream everything.
  repeated FilterEntry filters = 1;
}

message SubscribeSignedVAAResponse {
  // Raw VAA bytes.
  bytes vaa_bytes = 1;
}

service SpyRPCService {
  // Returns a stream of signed VAA messages received on the network.
  rpc SubscribeSignedVAA (SubscribeSignedVAARequest) returns (stream SubscribeSignedVAAResponse);
}
