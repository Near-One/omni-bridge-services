[workspace]
members = [
    "bridge-indexer-types",
    "omni-relayer",
    "omni-proxy",
    "wormhole-vaa-api",
]
resolver = "2"

[workspace.dependencies]
omni-types = { git = "https://github.com/near-one/omni-bridge", package = "omni-types", rev = "f499d46c2d58869e4cbb5d19cff703ff7d2731d6" }

# This patch mirrors the one in the bridge-sdk-rs workspace root (rev 87f33666). Cargo
# `[patch]` sections only apply from the consuming workspace root, so they do not transit
# through git dependencies and must be replicated here for the dependency tree to resolve.
# Keep it in sync with the bridge-sdk-rs rev used below.
# (bridge-sdk-rs also patches curve25519-dalek, but that fork is not pulled into this
# workspace's crate graph, so it is omitted to avoid an unused-patch warning.)
#
# zcash pins bip32 =0.6.0-pre.1, which exact-pins the RustCrypto pre-release digest-0.11
# chain and clashes with near-sdk 5.28.1's stable sha2 0.11. bridge-sdk-rs vendors a
# patched bip32 0.6.0-pre.1; point at that vendored crate in the bridge-sdk-rs repo.
[patch.crates-io.bip32]
git = "https://github.com/Near-One/bridge-sdk-rs"
rev = "87f336663d2bb7e74a009405d2198357c04cd59a"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# CI backends to support
ci = "github"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[workspace.metadata.dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
