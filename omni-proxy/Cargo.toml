[package]
name = "omni-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2.0.18"

toml = "1.1.2"
dotenv = "0.15.0"
async-trait = "0.1"
base64 = "0.22.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }

bytes = "1"
url = { version = "2.5.8", features = ["serde"] }
pingora = { version = "0.8.1", features = ["proxy", "openssl"] }

opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["metrics", "http-proto", "reqwest-client"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tracing-loki = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }

[dev-dependencies]
httpmock = "0.7"
reqwest = { version = "0.12", features = ["blocking"] }
serde_test = "1.0.177"

