name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'omni-relayer/**'
      - 'omni-proxy/**'
      - 'bridge-indexer-types/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: europe-west4-docker.pkg.dev
  PROJECT_ID: bridge-misc
  REPOSITORY: omni-bridge-docker-images

jobs:
  # Detect which service's files changed so each image builds independently.
  # omni-proxy is standalone; omni-relayer additionally depends on
  # bridge-indexer-types. Workspace files (Cargo.toml/Cargo.lock) affect both.
  # On release / manual dispatch the build jobs ignore this and build all.
  changes:
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      relayer: ${{ steps.filter.outputs.relayer }}
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relayer:
              - 'omni-relayer/**'
              - 'bridge-indexer-types/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            proxy:
              - 'omni-proxy/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  omni-relayer:
    needs: changes
    if: ${{ needs.changes.outputs.relayer == 'true' || github.event_name != 'push' }}
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/omni-relayer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: Warpbuilds/build-push-action@v6
        with:
          context: .
          file: ./omni-relayer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          profile-name: "bridge-docker-builder"

      - name: Output image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  omni-proxy:
    needs: changes
    if: ${{ needs.changes.outputs.proxy == 'true' || github.event_name != 'push' }}
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/omni-proxy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: Warpbuilds/build-push-action@v6
        with:
          context: .
          file: ./omni-proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          profile-name: "bridge-docker-builder"

      - name: Output image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
