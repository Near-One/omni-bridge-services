name: Build and Release BTC Relayer Binaries

# Migrated from btc-light-client-contract/.github/workflows/update-relayer.yml;
# same tag pattern, so existing release tooling keeps working.
permissions:
  contents: write

on:
  push:
    tags:
      - 'btc-relayer-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

defaults:
  run:
    working-directory: light-clients/btc-relayer

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            variant: default
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            variant: zcash
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            variant: dogecoin
          - target: aarch64-apple-darwin
            runner: macos-latest
            variant: default
          - target: aarch64-apple-darwin
            runner: macos-latest
            variant: zcash
          - target: aarch64-apple-darwin
            runner: macos-latest
            variant: dogecoin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Build relayer ( ${{ matrix.target }} / ${{ matrix.variant }} )
        run: |
          case "${{ matrix.variant }}" in
            default)  FLAGS="" ;;
            zcash)    FLAGS="--features zcash" ;;
            dogecoin) FLAGS="--features dogecoin" ;;
          esac

          cargo build --release --locked --target ${{ matrix.target }} $FLAGS

      - name: Collect binary into artifacts/
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/btc-relayer" \
             "artifacts/relayer-${{ matrix.target }}-${{ matrix.variant }}"

      - name: Upload per-variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: relayer-${{ matrix.target }}-${{ matrix.variant }}
          path: light-clients/btc-relayer/artifacts/relayer-${{ matrix.target }}-${{ matrix.variant }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all relayer binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**
